name: Check Links

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}


jobs:
  lychee:
    strategy:
      matrix:
        tags: ["0.1.0", "0.2.0", "0.2.1", "0.3.0"]

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Link Checker in the book
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: --root-dir tags/${{matrix.tags}}/book --require-https --no-progress --include-fragments --include-verbatim -v '*.md' tags/${{matrix.tags}}/book
          fail: false

      - name: Link Checker in the API docs
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: --root-dir tags/${{matrix.tags}}/. --require-https --no-progress --include-fragments --include-verbatim tags/${{matrix.tags}}/api
          fail: false
